
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream Books | Online Bookstore</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f7f7f4;
  color: #202b38;
}
header {
  background: #142b45;
  color: white;
  padding: 20px 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.logo { font-size: 25px; font-weight: bold; }
.cart { font-size: 15px; }
.hero {
  padding: 65px 7%;
  background: #e9e5da;
  text-align: center;
}
.hero h1 { font-size: 38px; margin: 0 0 12px; }
.hero p { color: #526070; }
.hero button, .book button {
  background: #142b45;
  color: white;
  border: 0;
  padding: 12px 20px;
  border-radius: 6px;
  cursor: pointer;
}
main { padding: 35px 6%; }
.search {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 8px;
  margin-bottom: 25px;
  font-size: 16px;
}
.books {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
  gap: 20px;
}
.book {
  background: white;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 3px 12px #0000000c;
}
.cover {
  height: 170px;
  border-radius: 7px;
  background: linear-gradient(140deg,#243f5b,#a5a18b);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  padding: 15px;
}
.book p { color: #687382; font-size: 14px; }
.price { font-weight: bold; margin: 12px 0; }
.book button { width: 100%; }
#cartDetails {
  background: white;
  padding: 18px;
  margin-top: 25px;
  border-radius: 9px;
}
footer {
  background: #142b45;
  color: white;
  text-align: center;
  padding: 25px;
  margin-top: 35px;
}
@media(max-width:480px) {
  .hero h1 { font-size: 29px; }
  .books { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .cover { height: 140px; }
}
</style>
</head>
<body>

<header>
  <div class="logo">📚 Dream Books</div>
  <div class="cart">🛒 Cart: <span id="count">0</span></div>
</header>

<section class="hero">
  <h1>Discover Your Next Favorite Book</h1>
  <p>Explore stories, knowledge and inspiration.</p>
  <button onclick="document.getElementById('collection').scrollIntoView()">
    Explore Books
  </button>
</section>

<main id="collection">
  <h2>Our Book Collection</h2>
  <input class="search" id="search"
    placeholder="Search for a book..."
    oninput="searchBooks()">

  <div class="books" id="books"></div>

  <section id="cartDetails">
    <h2>Your Shopping Cart</h2>
    <div id="cartItems">Your cart is empty.</div>
    <h3 id="total">Total: ETB 0</h3>
  </section>
</main>

<footer>
  <h3>Dream Books</h3>
  <p>Read more. Dream bigger.</p>
  <p>© 2026 Dream Books</p>
</footer>

<script>
const products = [
  {name:"The Power of Learning",author:"Knowledge Collection",price:450},
  {name:"Journey to Success",author:"Personal Growth",price:500},
  {name:"The Art of Thinking",author:"Mind & Ideas",price:400},
  {name:"Stories of Tomorrow",author:"Fiction Collection",price:350},
  {name:"Business & Dreams",author:"Business Collection",price:600},
  {name:"The World of Science",author:"Science Collection",price:550}
];

let cart = [];

function showBooks(items) {
  document.getElementById("books").innerHTML = items.map((book) => `
    <div class="book">
      <div class="cover">${book.name}</div>
      <h3>${book.name}</h3>
      <p>${book.author}</p>
      <div class="price">ETB ${book.price}</div>
      <button onclick="addToCart('${book.name}')">
        Add to Cart
      </button>
    </div>
  `).join("");
}

function searchBooks() {
  const query = document.getElementById("search").value.toLowerCase();
  showBooks(products.filter(book =>
    book.name.toLowerCase().includes(query) ||
    book.author.toLowerCase().includes(query)
  ));
}

function addToCart(name) {
  cart.push(products.find(book => book.name === name));
  updateCart();
}

function updateCart() {
  document.getElementById("count").textContent = cart.length;

  document.getElementById("cartItems").innerHTML =
    cart.length ? cart.map((book, index) =>
      `<p>${book.name} — ETB ${book.price}
      <button onclick="removeItem(${index})">Remove</button></p>`
    ).join("") : "Your cart is empty.";

  const total = cart.reduce((sum, book) => sum + book.price, 0);
  document.getElementById("total").textContent =
    "Total: ETB " + total;
}

function removeItem(index) {
  cart.splice(index, 1);
  updateCart();
}

showBooks(products);
</script>

</body>
</html>
